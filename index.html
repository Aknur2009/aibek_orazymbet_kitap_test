<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ерте темір дәуірі — тест</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1c2733;--mute:#5d6b79;--line:#cfd6dd;--acc:#1f4e79;--gold:#b8860b;--ok:#1d7a4a;--okbg:#e2f3ea;--bad:#b3341f;--badbg:#f9e3df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b22;--card:#1e2830;--ink:#e6ecf1;--mute:#93a1ae;--line:#33414d;--acc:#7fb2e0;--gold:#e0b84a;--ok:#5ccf93;--okbg:#17372a;--bad:#ff8d78;--badbg:#3d201b}}
:root[data-theme="dark"]{--bg:#141b22;--card:#1e2830;--ink:#e6ecf1;--mute:#93a1ae;--line:#33414d;--acc:#7fb2e0;--gold:#e0b84a;--ok:#5ccf93;--okbg:#17372a;--bad:#ff8d78;--badbg:#3d201b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "PT Sans",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font:700 26px/1.2 "PT Serif",Georgia,serif;margin:8px 0 4px}
p.sub{color:var(--mute);margin:0 0 18px}
.sec{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.sec input{width:20px;height:20px;accent-color:var(--acc)}
.sec b{flex:1;font-weight:700}
.sec span{color:var(--mute);font-size:15px}
button{font:inherit;cursor:pointer}
.go{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700}
.go:focus-visible,.opt:focus-visible,.next:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:15px;margin-bottom:6px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--gold);width:0}
.q{font:700 21px/1.3 "PT Serif",Georgia,serif;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.next{width:100%;margin-top:6px;padding:13px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);border-radius:10px;font-weight:700}
.score{font:700 44px/1 "PT Serif",Georgia,serif;margin:10px 0 4px;color:var(--acc)}
.wrong{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.wrong small{color:var(--mute);display:block}
.wrong strong{color:var(--ok)}
.why{background:var(--badbg);border-left:4px solid var(--bad);border-radius:8px;padding:11px 13px;margin:4px 0 8px;font-size:16px}
.why b{color:var(--ok)}
.hide{display:none}
</style>
</head>
<body>
<main>
<div id="start">
  <h1>Ерте темір дәуірі</h1>
  <p class="sub">Сақтар, сарматтар, ғұндар, үйсіндер, қаңлылар. Тақырыпты таңдаңыз.</p>
  <div id="secs"></div>
  <label class="sec" style="cursor:default"><b>Сұрақ саны</b><select id="cnt" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)"><option value="20">20</option><option value="50" selected>50</option><option value="100">100</option><option value="0">Барлығы</option></select></label>
  <button class="go" id="go">Тестті бастау</button>
</div>
<div id="quiz" class="hide">
  <div class="top"><span id="sn"></span><span id="pos"></span></div>
  <div class="bar"><i id="pb"></i></div>
  <p class="q" id="qt"></p>
  <div id="opts"></div>
  <div class="why hide" id="why"></div>
  <button class="next hide" id="nx">Келесі сұрақ</button>
</div>
<div id="end" class="hide">
  <h1>Нәтиже</h1>
  <div class="score" id="sc"></div>
  <p class="sub" id="scs"></p>
  <div id="wl"></div>
  <button class="go" id="again">Қайта тапсыру</button>
  <button class="next" id="redo">Тек қателерді қайталау</button>
</div>
</main>

"«Жаратылыстану тарихы»":"Үлкен Плиний — «Жаратылыстану тарихы», Птолемей — «География», Геродот — «Тарих», Сыма Цян — «Тарихи жазбалар».",
"Ресей империясы кезінде «Орталық Азия» ұғымы":"Орталық Азия ұғымымен қатар «Түркістан» да қолданылған; Ресей империясының иелігі — «Түркістан өлкесі».",
"Ұлы Даланың аумағында құрылған мемлекеттердің":"Түрік → Батыс Түрік → Түргеш → Қарлұқ қағанаттары.",
"Неолиттік төңкерістің себебі":"Тұрғындар саны артып, өндірістік дағдарыс болды; шешімі — егіншілік пен мал шаруашылығы (өндіруші шаруашылық).",
"Сақ-массагеттердің Кирді талқандаған жылы":"Б.з.б. 530 ж. Томирис бастаған массагеттер Кирдің әскерін талқандап, Кирдің өзі қаза тапты (Геродот).",
"І Дарийдің сақтарға жорығы":"Кирден кейін І Дарий б.з.б. 519 ж. сақ-тиграхаудаларға шабуыл жасап, көсемі Скунханы тұтқындады.",
"Марафон шайқасы болған жыл":"Б.з.б. 490 ж. Марафонда парсы әскері құрамында сақтар да гректерге қарсы соғысты.",
"Б.з.б. 331 ж. болған оқиға":"Гавгамела шайқасында Александр Македонский III Дарийдің әскерін талқандады.",
"Сақтар тарихындағы оқиғалардың дұрыс реті":"530 (Кир–Томирис) → 519 (І Дарий–Скунха) → 490 (Марафон) → 331 (Гавгамела).",
"Сақ жеріне жорық жасаған патшалар":"Кир (б.з.б. 530), І Дарий (519), Александр Македонский (IV ғ. 30-жылдары).",
"Б.з.б. 518 ж.":"Шырақ Дарий әскерін адастырып, шөл далада қырылуына себепші болды. Бұл — ерлік аңызы.",
"Сақтар заманы туралы ең алғашқы дереккөз":"Ең ерте — парсы жазбалары (б.з.б. VI ғ. соңы), одан кейін Геродот, содан кейін қытай жылнамалары.",
"Есік обасын зерттеген археолог":"Есік қорғаны — Жетісуда, «Алтын адамды» К. Ақышев 1969 ж. тапты; ханзада 17–18 жаста.",
"Есік қорғанындағы «Алтын адам»":"Есік қорғаны — Жетісуда, «Алтын адамды» К. Ақышев 1969 ж. тапты.",
"Тасмола мәдениетінің ерекшелігі":"Тасмола — исседондар мәдениеті: мұртты қорғандар, екі доға тәрізді тас тізбектер, адам мен жылқы қатар жерленген.",
"Ең биік сақ қорғандары":"Бесшатыр — Жетісуда, Іле өзенінің оң жағалауында, ең биік сақ қорғандары.",
"Пазырық кілемі сақтаулы қала":"Пазырық кілемі Санкт-Петербургтегі Мемлекеттік Эрмитажда сақтаулы.",
"Сарматтарды Ұлы Даланың батысынан":"Сарматтарды б.з.б. ІІІ ғ. дах-массагеттер ығыстырды.",
"Сармат ескерткіштерінің ең жақсы":"Сынтас — ең жақсы зерттелген, үш жауынгер жерленген. Бесоба — абыз әйелдер (Ақтөбе), Аралтөбе — Атырау.",
"Сарматтардың абыз әйелдері жерленген қорым":"Бесоба — Ақтөбе облысында, абыз әйелдер жерленген.",
"Ғұн империясының негізін салған":"Мөде б.з.б. 209 ж. билікке келіп, ғұн тайпаларын бір мемлекетке біріктірді.",
"Ғұн мемлекетінің сыртқы саясаттағы":"Ғұндарда жоғарғы билеуші — тәңірқұт (қытайша шаньюй). Түменбасы — 10 мың жауынгер басшысы, шаньюйдің туысы.",
"Б.з.б. 165 ж.":"Ғұндар юэчжилерді толық жеңді. Соғыс төрт ғасыр созылды, юэчжилер Қазақстанға көшті.",
"Ғұндар мен юэчжилер соғысы":"Соғыс төрт ғасыр созылды; б.з.б. 165 ж. ғұндар толық жеңді.",
"Үйсіндер мемлекеті құрылған уақыт":"Үйсіндер б.з.б. ІІ ғасырдың басында мемлекет құрды (Жетісу, Тарбағатай, Тянь-Шань).",
"Үйсіндердің жоғары билеушісі":"Титулдар: үйсінде — күнби, ғұнда — шаньюй/тәңірқұт, қаңлыда — хан, сақта — патша.",
"Қаңлы билеушісінің титулы":"Титулдар: қаңлыда — хан, үйсінде — күнби, ғұнда — шаньюй/тәңірқұт, сақта — патша.",
"Жазба деректерде сақ мемлекеті":"Титулдар: сақта — патша, үйсінде — күнби, ғұнда — шаньюй/тәңірқұт, қаңлыда — хан.",
"Үйсіндердің астанасы":"Астана — Қызыл-Аңғар (Чигу), Ыстықкөл маңында. Күнбидің сарайы осында болды.",
"Үйсіндер Қытайдан толық құтылған кезең":"ІІ ғ. Қытайдан толық құтылды; IV ғ. жужандар қысымымен Тянь-Шаньға көшті.",
"IV ғ. үйсіндерді":"IV ғ. жужандардың қысымымен үйсіндер Тянь-Шань тауларына қоныс аударды.",
"Қарғалы шатқалынан":"Қарғалы тәтісі — үйсіндердікі: әлем бейнесі, құстар мен қанатты тұлпар аспан мен күнді білдіреді.",
"Қаңлылардың Сырдария бойындағы астанасы":"Қаңлы астанасы — Битянь, Түркістан маңында.",
"Қаңлылар бақылауында ұстаған":"Қаңлылар Ұлы Жібек жолының аса маңызды орталық бөлігін бақылады."
};
function why(q){var k=Object.keys(E);for(var i=0;i<k.length;i++){if(q.indexOf(k[i])===0)return E[k[i]];}return "";}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function opts(x){
  var ds=Array.isArray(x[2])?x[2].slice():shuffle(pools[x[2]].filter(function(v){return v!==x[1]})).slice(0,3);
  var out=[x[1]];ds.forEach(function(d){if(out.indexOf(d)<0&&out.length<4)out.push(d);});return shuffle(out);
}
var secsEl=document.getElementById("secs");
D.forEach(function(s,i){
  var l=document.createElement("label");l.className="sec";
  l.innerHTML='<input type="checkbox" checked data-i="'+i+'"><b>'+s.n+'</b><span>'+s.q.length+' сұрақ</span>';
  secsEl.appendChild(l);
});
var Q=[],idx=0,score=0,wrong=[];
function show(id){["start","quiz","end"].forEach(function(k){document.getElementById(k).classList.toggle("hide",k!==id)});window.scrollTo(0,0);}
function begin(list){
  Q=shuffle(list);idx=0;score=0;wrong=[];
  if(!Q.length)return;
  show("quiz");render();
}
function render(){
  var x=Q[idx];
  document.getElementById("sn").textContent=x.s;
  document.getElementById("pos").textContent=(idx+1)+" / "+Q.length;
  document.getElementById("pb").style.width=(idx/Q.length*100)+"%";
  document.getElementById("qt").textContent=x.q[0]+"?";
  var box=document.getElementById("opts");box.innerHTML="";
  opts(x.q).forEach(function(o){
    var b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=function(){pick(b,o)};box.appendChild(b);
  });
  document.getElementById("nx").classList.add("hide");document.getElementById("why").classList.add("hide");
}
function pick(b,o){
  var x=Q[idx],ok=o===x.q[1];
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(e){
    e.disabled=true;if(e.textContent===x.q[1])e.classList.add("ok");
  });
  var w=document.getElementById("why");
  if(ok){score++;}else{b.classList.add("bad");wrong.push(x);
    w.innerHTML="";var bb=document.createElement("b");bb.textContent="Дұрыс жауап: "+x.q[1];w.appendChild(bb);
    var t=why(x.q[0]);if(t){w.appendChild(document.createElement("br"));w.appendChild(document.createTextNode(t));}
    w.classList.remove("hide");}
  var n=document.getElementById("nx");n.textContent=idx===Q.length-1?"Нәтижені көру":"Келесі сұрақ";n.classList.remove("hide");n.focus();
}
document.getElementById("nx").onclick=function(){
  idx++;if(idx>=Q.length)finish();else render();
};
function finish(){
  show("end");
  document.getElementById("sc").textContent=score+" / "+Q.length;
  document.getElementById("scs").textContent=Math.round(score/Q.length*100)+"% дұрыс";
  var w=document.getElementById("wl");w.innerHTML="";
  wrong.forEach(function(x){
    var d=document.createElement("div");d.className="wrong";
    var s=document.createElement("small");s.textContent=x.q[0];
    var st=document.createElement("strong");st.textContent=x.q[1];
    d.appendChild(s);d.appendChild(st);var t=why(x.q[0]);if(t){var e=document.createElement("small");e.textContent=t;d.appendChild(e);}w.appendChild(d);
  });
  document.getElementById("redo").classList.toggle("hide",!wrong.length);
}
document.getElementById("go").onclick=function(){
  var l=[];
  Array.prototype.forEach.call(document.querySelectorAll("#secs input:checked"),function(c){
    var s=D[+c.dataset.i];s.q.forEach(function(x){l.push({s:s.n,q:x})});
  });
  l=shuffle(l);var c=+document.getElementById("cnt").value;if(c>0)l=l.slice(0,c);
  begin(l);
};
document.getElementById("again").onclick=function(){show("start")};
document.getElementById("redo").onclick=function(){begin(wrong.slice())};
</script>
</body>
</html>
